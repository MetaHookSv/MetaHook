name: Build Windows x86 Release
description: Build, validate and package the MetaHook runtime and gamedata.

outputs:
  archive-path:
    description: Absolute path to the Windows x86 7z archive.
    value: ${{ steps.package.outputs.archive-path }}
  timestamp:
    description: UTC timestamp for the build artifact name.
    value: ${{ steps.package.outputs.timestamp }}

runs:
  using: composite
  steps:
    - name: Build and install
      shell: cmd
      run: call scripts\build-MetaHook-x86-Release.bat

    - name: Validate installed gamedata
      shell: cmd
      run: python scripts\validate-gamedata.py install\x86\Release\svencoop\metahook\gamedata --manifest scripts\manifests\metahook.json

    - name: Package runtime and gamedata
      id: package
      shell: pwsh
      working-directory: install/x86/Release
      run: |
        $archiveDirectory = Join-Path $env:GITHUB_WORKSPACE 'build/artifacts'
        New-Item -ItemType Directory -Path $archiveDirectory -Force | Out-Null
        $archivePath = Join-Path $archiveDirectory 'MetaHook-windows-x86.7z'
        if (Test-Path -LiteralPath $archivePath -PathType Leaf) {
          Remove-Item -LiteralPath $archivePath
        }
        & 7z a -t7z $archivePath 'MetaHook.exe' 'MetaHook.pdb' 'MetaHook_blob.exe' 'MetaHook_blob.pdb' 'SDL2.dll' 'SDL3.dll' 'svencoop'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & 7z t $archivePath
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "archive-path=$archivePath" >> $env:GITHUB_OUTPUT
        "timestamp=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd-HH-mm-ss'))" >> $env:GITHUB_OUTPUT
