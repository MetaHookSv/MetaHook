name: LiveBuild

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win32:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository and dependencies
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build and package Windows x86 Release
        id: build
        uses: ./.github/actions/build-windows-x86

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MetaHook-${{ steps.build.outputs.timestamp }}
          path: ${{ steps.build.outputs.archive-path }}
          if-no-files-found: error
          compression-level: 0
